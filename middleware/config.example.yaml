# Example middleware config. Copy to config.local.yaml (or run
# `python -m middleware.setup_wizard`) and keep that file out of git.
# Relative paths are relative to the repository root, not the current folder.

service:
  bind_host: 127.0.0.1
  bind_port: 8787
  shared_secret: change-me      # must match shared_secret in the CET mod's config.json
  dry_run: true                 # true = simulated output only. Live also needs --live.
  allow_shock: false            # shock also requires the game to be ARMED
  max_intensity: 20             # hard cap for every output (1-100)
  max_duration_ms: 2000         # hard cap for every output (100-15000)
  default_cooldown_ms: 1500
  session_max_shock_level: 100  # damage% * this = damage shock intensity (then capped)
  # The PiShock API takes whole seconds, so anything under 2000 ms runs for 1 s.
  # true = send vibrate/beep of 100-1500 ms as milliseconds instead. This is an
  # undocumented API feature that old PiShock Plus hubs misread (300 ms -> 3 s),
  # so it is off by default and never applies to shock.
  subsecond_vibrate_beep: false

safety:
  max_actions_per_minute: 20    # across all events
  global_cooldown_ms: 500       # minimum gap between any two outputs
  max_event_age_s: 10           # drop events older than this (no replay into hardware)
  estop_file: middleware/state/ESTOP  # while this file exists nothing is output

ingest:
  outbox_path: emitter/cet/mods/pishock_emitter/outbox/events.jsonl
  poll_interval_s: 0.1

pishock:
  username: your_username
  apikey: your_api_key
  code: your_share_code
  name: CyberpunkBridge

event_mappings:
  player_damaged:
    mode: shock
    fallback_mode: vibrate      # used while shock is disabled or the game is not armed
    intensity: 8
    duration_ms: 400
    cooldown_ms: 2000
  player_healed:
    mode: vibrate
    intensity: 10
    duration_ms: 500
    cooldown_ms: 1500
  player_death:
    mode: beep
    intensity: 1
    duration_ms: 1000
    cooldown_ms: 5000
  combat_start:
    mode: vibrate
    intensity: 6
    duration_ms: 300
    cooldown_ms: 5000
  quest_completed:
    mode: vibrate
    intensity: 14
    duration_ms: 700
    cooldown_ms: 4000
  test_pulse:
    mode: beep
    intensity: 1
    duration_ms: 300
    cooldown_ms: 1000
